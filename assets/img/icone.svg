<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EA1A1"/>
      <stop offset="100%" stop-color="#587979"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D7CA"/>
      <stop offset="100%" stop-color="#D9C7B8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="18" fill="#F4F7F6"/>
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="#6B8E8E" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Stylized Elegant Psi Symbol -->
  <!-- Central stem -->
