  <!-- Curved arms representing listening and embracing -->
  <path d="M19 24C19 35.5 25 41 32 41C39 41 45 35.5 45 24" stroke="url(#sageGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Organic warm leaf / seed accent representing growth & rebirth -->
  <circle cx="32" cy="13.5" r="3.2" fill="#D9C7B8"/>
  <circle cx="19" cy="23.5" r="2.8" fill="#D9C7B8"/>
  <circle cx="45" cy="23.5" r="2.8" fill="#D9C7B8"/>
